name: build-frida-ios-stealth

# Triggers:
#   - workflow_dispatch: manual build (input frida_version, blank = latest stable)
#   - push: rebuild when build scripts / packaging change
#   - schedule: DAILY check of the upstream frida/frida release; if a newer frida
#     version exists than the last one we published here, auto-build it with the
#     stealth + roothide patches and publish a GitHub Release. Already-up-to-date
#     runs skip the build (saves CI minutes).
on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: "Frida version tag to build (blank = latest stable release from frida/frida)"
        required: false
        default: ""
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build.yml"
      - "scripts/**"
      - "tools/**"
      - "patches-ios/**"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

# Keep builds serialised, but never cancel an in-flight run. With
# cancel-in-progress: true a delayed/duplicated schedule could kill the only
# run before it is ever assigned a runner.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # GitHub retired macos-14 on 2026-11-02 (jobs were cancelled with
    # "configuration macos-14-arm64-us-default is not supported").
    # macos-15 (arm64, 3C/7G) repeatedly queued 15+ minutes and was cancelled
    # with "job was not acquired by Runner of type hosted ... capacity
    # constraints for macOS arm64". macos-15-intel is 4C/14G with a much less
    # contended queue; Xcode cross-compiles iOS arm64e from Intel just fine.
    runs-on: macos-15-intel
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Decide WHAT to build (and whether to build at all):
      #   - dispatch with a version  -> build that version
      #   - schedule                 -> latest frida/frida release; skip if already published
      #   - push                     -> latest frida/frida release (rebuild)
      - name: Resolve frida version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.frida_version }}" ]; then
            echo "ver=${{ github.event.inputs.frida_version }}" >> "$GITHUB_OUTPUT"
            echo "build=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Latest stable upstream release of frida/frida (the real upstream of this build).
          # Use the authenticated CLI: unauthenticated curl to api.github.com
          # hits the shared runner IP rate limit (403) and breaks the whole run.
          LATEST="$(gh api repos/frida/frida/releases/latest --jq '.tag_name')"
          if [ -z "$LATEST" ]; then
            echo "::error::could not resolve upstream frida/frida latest release"
            exit 1
          fi
          echo "upstream frida/frida latest tag: $LATEST"
          # Last version published in THIS repo (strip leading v for comparison).
          CURRENT="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName \
            --jq '.[0].tagName' 2>/dev/null | sed 's/^v//')" || CURRENT=""
          echo "current repo release: ${CURRENT:-none}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$CURRENT" ] \
             && [ "$(echo "$LATEST" | sed 's/^v//')" = "$CURRENT" ]; then
            echo "::notice::upstream ($LATEST) already built here; nothing to do"
            echo "build=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ver=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "build=yes" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        if: steps.resolve.outputs.build == 'yes'
        run: |
          echo "Available Xcodes:"; ls /Applications | grep -i xcode || true
          # Xcode only controls the SDK/clang; all Apple clang versions on
          # these images (15.4 / 16.4 / 26.3) are clang-17 based and reject
          # the libc++ __visibility__ pragma. The real fix lives in
          # scripts/build-ios.sh, which neutralises that macro in the vendored
          # SDK. Prefer Xcode 16.4 (iOS 18.5 SDK, configure is known to work),
          # otherwise fall back to the numerically highest installed Xcode.
          XCODE="/Applications/Xcode_16.4.app"
          if [ ! -d "$XCODE" ]; then
            XCODE="$(python3 -c 'import glob,re; c=glob.glob("/Applications/Xcode_*.app"); k=lambda p:tuple(int(x or 0) for x in re.search(r"Xcode_([0-9]+)(?:\.([0-9]+))?(?:\.([0-9]+))?",p).groups()) if re.search(r"Xcode_([0-9]+)",p) else (0,0,0); print(max(c,key=k) if c else "")')"
          fi
          if [ -z "$XCODE" ]; then
            XCODE="$(xcode-select -p | sed 's|/Contents/Developer$||')"
            echo "Falling back to default Xcode: $XCODE"
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version || true
          clang --version || true
          xcrun --sdk iphoneos --show-sdk-path || true

      - name: Install build deps
        if: steps.resolve.outputs.build == 'yes'
        run: |
          brew install make dpkg ldid coreutils || true
          echo "node: $(node --version 2>/dev/null)"
          echo "npm:  $(npm --version 2>/dev/null)"
          echo "py:   $(python3 --version 2>/dev/null)"
          echo "gmake: $(gmake --version 2>/dev/null | head -1)"

      - name: Build frida-server (iOS rootless arm64e)
        id: build
        if: steps.resolve.outputs.build == 'yes'
        run: |
          set -o pipefail
          bash scripts/build-ios.sh "${{ steps.resolve.outputs.ver }}" 2>&1 | tee build.log

      - name: Read frida version
        if: always() && steps.resolve.outputs.build == 'yes'
        id: meta
        run: |
          if [ -f out/FRIDA_VERSION.txt ]; then
            echo "ver=$(cat out/FRIDA_VERSION.txt)" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifacts
        if: always() && steps.resolve.outputs.build == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: frida-ios-stealth
          path: |
            out/*.deb
            build.log
            patch-report.txt
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: steps.resolve.outputs.build == 'yes' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${{ steps.meta.outputs.ver }}"
          [ -z "$ver" ] && ver="unknown"
          tag="v${ver}"
          notes="release-notes.md"
          {
            echo "Anti-detect frida-server for iOS - roothide Dopamine, rootless, arm64e."
            echo
            echo "- frida version: \`${ver}\`"
            echo "- built: $(date -u +%FT%TZ) in GitHub Actions (macos-14)"
            echo
            echo "## Applied / skipped Florida patches"
            echo '```'
            cat patch-report.txt 2>/dev/null || echo "no patch report"
            echo '```'
          } > "$notes"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" out/*.deb --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --notes-file "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" out/*.deb \
              --title "frida-server stealth ${ver} (rootless arm64e)" \
              --notes-file "$notes" \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Report status to ci-status branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/report-status.sh "${{ job.status }}"
